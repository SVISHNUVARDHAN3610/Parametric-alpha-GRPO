[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-grpo"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "Full-parameter parametric GRPO experiments on OLMo 2"
dependencies = ["PyYAML==6.0.2"]

[project.optional-dependencies]
kaggle = [
    # vLLM 0.21.0 on PyPI was built for CUDA 13.0. Use the CUDA 12.9 release wheel.
    "vllm @ https://github.com/vllm-project/vllm/releases/download/v0.21.0/vllm-0.21.0+cu129-cp38-abi3-manylinux_2_34_x86_64.whl#sha256=920777691e340df7a8328adfb1e57b9996dbb537edfb654dd32f70844f5f423d",
    "torch==2.11.0+cu129",
    "transformers==4.57.6",
    "bitsandbytes==0.49.2",
    "datasets==4.5.0",
    "huggingface-hub>=0.34,<1",
    "math-verify[antlr4_13_2]==0.9.0",
    "langdetect==1.0.9",
    "psutil>=6,<8",
    "nvidia-ml-py>=12",
    "pyarrow>=19",
    "matplotlib>=3.9,<4",
]
evaluation = ["lm-eval[hf,ifeval]==0.4.11", "math-verify[antlr4_13_2]==0.9.0"]
test = ["pytest>=8,<10"]

[project.scripts]
alpha-grpo = "alpha_grpo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
